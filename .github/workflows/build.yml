name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds the exe and attaches it to the release as a zip.
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # dav1d (the AV1 decoder behind AVIF) builds with meson and uses nasm for its assembly.
      - uses: ilammy/setup-nasm@v1
      - name: Install meson
        run: pip install meson ninja

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target hyper-texture-viewer htv_tests

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Startup benchmark
        shell: pwsh
        run: |
          build/Release/htv_tests.exe --write-samples samples
          $exe = "build/Release/hyper-texture-viewer.exe"
          $failed = $false
          foreach ($f in Get-ChildItem samples) {
            $p = Start-Process $exe -ArgumentList "--bench", "bench.txt", "`"$($f.FullName)`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Host ("FAILED: {0} (exit code 0x{1:X8})" -f $f.Name, $p.ExitCode); $failed = $true }
          }
          if (Test-Path bench.txt) { Get-Content bench.txt } else { Write-Host "no bench.txt written" }
          "exe size: {0:N0} bytes" -f (Get-Item $exe).Length
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: hyper-texture-viewer
          path: |
            build/Release/hyper-texture-viewer.exe
            bench.txt

      - name: Attach the exe to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path build/Release/hyper-texture-viewer.exe -DestinationPath HyperTextureViewer-win64.zip
          gh release upload "${{ github.event.release.tag_name }}" HyperTextureViewer-win64.zip --clobber

  loader-tests:
    # The loaders are platform independent; run them with sanitizers to catch memory errors in file parsing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          sudo apt-get install -y nasm
          pip install meson ninja
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHTV_SANITIZE=address,undefined
          # Only what the tests need, with bounded parallelism: an unbounded make -j runs the runner out of memory.
          cmake --build build --parallel 4 --target htv_tests
          ctest --test-dir build --output-on-failure
